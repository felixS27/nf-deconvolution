name: deconvolution/convert_to_ome_zarr
version: 1.0.0
description: Stack per-timepoint deconvolved TIFFs into one OME-Zarr image per dataset_id/channel_index/scene
license: Apache-2.0
input:
- - name: meta
    type: map
    description: >-
      Groovy map with group-level metadata, e.g. `[id: dataset_id,
      channel_index: 0, scene: 0, physical_voxel_size_xy_nm: 65.0,
      physical_voxel_size_z_nm: 300.0]`. One group per (dataset_id,
      channel_index, scene) — every time point belonging to that
      channel/scene is combined into a single OME-Zarr.
  - name: tifs
    type: file
    description: >-
      Deconvolved 3D (ZYX) TIFFs for this dataset_id/channel_index/scene,
      one per time point, e.g. from the deconwolf module. Time ordering is
      recovered from each filename (`_T<time>_C<channel>`) rather than
      passed alongside as separate metadata.
output:
- - name: meta
    type: map
    description: Groovy map with group-level metadata, matching the input `meta`
  - type: file
    description: OME-Zarr image (ZYX, or TZYX when more than one time point is present) for this dataset_id/channel_index/scene
